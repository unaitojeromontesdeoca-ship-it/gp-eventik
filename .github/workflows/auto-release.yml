name: {{NAME}} Auto Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '{{PREFIX}}-plugin.json'  # Evita el bucle infinito por el auto-commit de versión

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-release:
    name: Auto Release on Main Push
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, json, mbstring

      - name: Get current version from {{PREFIX}}-plugin.json
        id: get_current_version
        run: |
          CURRENT_VERSION=$(jq -r '.version' {{PREFIX}}-plugin.json)
          echo "Current version: $CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Increment version (SEMVER patch)
        id: increment_version
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.get_current_version.outputs.current_version }}"
          new_patch=$((patch + 1))
          NEW_VERSION="$major.$minor.$new_patch"
          echo "Incremented version: ${{ steps.get_current_version.outputs.current_version }} -> $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Run build script
        run: php scripts/build.php ${{ steps.increment_version.outputs.new_version }}

      - name: Validate build artifacts
        run: |
          echo "🔍 Validando artefactos del build..."

          if [ ! -f "dist/{{SLUG}}.zip" ]; then
            echo "❌ Error: ZIP no encontrado"
            exit 1
          fi

          if [ ! -f "dist/{{SLUG}}/{{PREFIX}}-plugin.json" ]; then
            echo "❌ Error: {{PREFIX}}-plugin.json no encontrado"
            exit 1
          fi

          JSON_VERSION=$(jq -r '.version' dist/{{SLUG}}/{{PREFIX}}-plugin.json)
          if [ "$JSON_VERSION" != "${{ steps.increment_version.outputs.new_version }}" ]; then
            echo "❌ Error: versión distinta en {{PREFIX}}-plugin.json (esperada ${{ steps.increment_version.outputs.new_version }}, obtenida $JSON_VERSION)"
            exit 1
          fi

          unzip -l dist/{{SLUG}}.zip | grep -q "{{SLUG}}/{{SLUG}}.php"
          if [ $? -ne 0 ]; then
            echo "❌ Error: estructura del ZIP incorrecta - falta {{SLUG}}/{{SLUG}}.php"
            exit 1
          fi

          TMP_DIR=$(mktemp -d)
          unzip -q dist/{{SLUG}}.zip -d $TMP_DIR
          ZIP_VERSION=$(grep "Version:" $TMP_DIR/{{SLUG}}/{{SLUG}}.php | head -1 | awk '{print $3}')
          ZIP_CONSTANT=$(grep "define('GPS_VERSION'" $TMP_DIR/{{SLUG}}/{{SLUG}}.php | awk -F"'" '{print $4}')
          rm -rf $TMP_DIR

          if [ "$ZIP_VERSION" != "${{ steps.increment_version.outputs.new_version }}" ]; then
            echo "❌ Error: versión distinta en la cabecera del ZIP (esperada ${{ steps.increment_version.outputs.new_version }}, obtenida $ZIP_VERSION)"
            exit 1
          fi

          if [ "$ZIP_CONSTANT" != "${{ steps.increment_version.outputs.new_version }}" ]; then
            echo "❌ Error: versión distinta en la constante GPS_VERSION (esperada ${{ steps.increment_version.outputs.new_version }}, obtenida $ZIP_CONSTANT)"
            exit 1
          fi

          echo "✅ Todas las validaciones del build pasaron"

      - name: Update {{PREFIX}}-plugin.json with new version
        run: |
          jq --arg version "${{ steps.increment_version.outputs.new_version }}" '.version = $version' {{PREFIX}}-plugin.json > {{PREFIX}}-plugin.json.tmp
          mv {{PREFIX}}-plugin.json.tmp {{PREFIX}}-plugin.json
          echo "Actualizado {{PREFIX}}-plugin.json a la versión ${{ steps.increment_version.outputs.new_version }}"

      - name: Commit version update
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add {{PREFIX}}-plugin.json
          git commit -m "chore: auto-increment version to ${{ steps.increment_version.outputs.new_version }}"
          git push origin main
          echo "✅ Versión commiteada a main"

      - name: Set SFTP port with default
        id: set_sftp_port
        run: |
          if [ -z "${{ secrets.SFTP_PORT }}" ]; then
            echo "sftp_port=22" >> $GITHUB_OUTPUT
          else
            echo "sftp_port=${{ secrets.SFTP_PORT }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to IONOS via lftp
        run: |
          echo "🔍 Desplegando por lftp..."
          sudo apt-get update
          sudo apt-get install -y lftp

          lftp -u ${{ secrets.SFTP_USER }},${{ secrets.SFTP_PASSWORD }} -p ${{ steps.set_sftp_port.outputs.sftp_port }} sftp://${{ secrets.SFTP_HOST }} << LFTPEOF
          set sftp:auto-confirm yes
          set ssl:verify-certificate no
          cd updates
          pwd
          ls
          put dist/{{SLUG}}/{{PREFIX}}-plugin.json -o {{PREFIX}}-plugin.json
          put dist/{{SLUG}}.zip -o {{SLUG}}.zip
          bye
          LFTPEOF

      - name: Validate deployment URLs
        run: |
          echo "🔍 Validando URLs de despliegue..."
          sleep 10

          JSON_URL="https://generacionpresente.org/wp-content/updates/{{PREFIX}}-plugin.json"
          JSON_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$JSON_URL")
          if [ "$JSON_STATUS" -ne 200 ]; then
            echo "❌ Error: {{PREFIX}}-plugin.json no accesible (HTTP $JSON_STATUS)"
            exit 1
          fi

          ZIP_URL="https://generacionpresente.org/wp-content/updates/{{SLUG}}.zip"
          ZIP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ZIP_URL")
          if [ "$ZIP_STATUS" -ne 200 ]; then
            echo "❌ Error: {{SLUG}}.zip no accesible (HTTP $ZIP_STATUS)"
            exit 1
          fi

          REMOTE_VERSION=$(curl -s "$JSON_URL" | jq -r '.version')
          if [ "$REMOTE_VERSION" != "${{ steps.increment_version.outputs.new_version }}" ]; then
            echo "❌ Error: versión remota distinta (esperada ${{ steps.increment_version.outputs.new_version }}, obtenida $REMOTE_VERSION)"
            exit 1
          fi

          REMOTE_NAME=$(curl -s "$JSON_URL" | jq -r '.name')
          REMOTE_SLUG=$(curl -s "$JSON_URL" | jq -r '.slug')
          REMOTE_DOWNLOAD_URL=$(curl -s "$JSON_URL" | jq -r '.download_url')

          if [ "$REMOTE_NAME" != "{{NAME}}" ]; then
            echo "❌ Error: name remoto incorrecto (esperado '{{NAME}}', obtenido '$REMOTE_NAME')"
            exit 1
          fi

          if [ "$REMOTE_SLUG" != "{{SLUG}}" ]; then
            echo "❌ Error: slug remoto incorrecto (esperado '{{SLUG}}', obtenido '$REMOTE_SLUG')"
            exit 1
          fi

          if [[ ! "$REMOTE_DOWNLOAD_URL" == *"{{SLUG}}.zip"* ]]; then
            echo "❌ Error: download_url remoto incorrecto (esperado contener '{{SLUG}}.zip', obtenido '$REMOTE_DOWNLOAD_URL')"
            exit 1
          fi

          echo "✅ Todas las validaciones de despliegue pasaron"
          echo "📊 JSON: $JSON_URL"
          echo "📦 ZIP:  $ZIP_URL"

      - name: Clean up
        run: rm -rf dist
