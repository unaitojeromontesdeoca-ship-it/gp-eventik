name: GP Eventik Auto Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'gpe-plugin.json'  # Evita el bucle infinito por el auto-commit de versión

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-release:
    name: Auto Release on Main Push
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, json, mbstring

      - name: Get current version from gpe-plugin.json
        id: get_current_version
        run: |
          CURRENT_VERSION=$(jq -r '.version' gpe-plugin.json)
          echo "Current version: $CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Increment version (SEMVER patch)
        id: increment_version
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.get_current_version.outputs.current_version }}"
          new_patch=$((patch + 1))
          NEW_VERSION="$major.$minor.$new_patch"
          echo "Incremented version: ${{ steps.get_current_version.outputs.current_version }} -> $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Run build script
        run: php scripts/build.php ${{ steps.increment_version.outputs.new_version }}

      - name: Validate build artifacts
        run: |
          echo "🔍 Validando artefactos del build..."

          if [ ! -f "dist/gp-eventik.zip" ]; then
            echo "❌ Error: ZIP no encontrado"
            exit 1
          fi

          if [ ! -f "dist/gp-eventik/gpe-plugin.json" ]; then
            echo "❌ Error: gpe-plugin.json no encontrado"
            exit 1
          fi

          JSON_VERSION=$(jq -r '.version' dist/gp-eventik/gpe-plugin.json)
          if [ "$JSON_VERSION" != "${{ steps.increment_version.outputs.new_version }}" ]; then
            echo "❌ Error: versión distinta en gpe-plugin.json (esperada ${{ steps.increment_version.outputs.new_version }}, obtenida $JSON_VERSION)"
            exit 1
          fi

          unzip -l dist/gp-eventik.zip | grep -q "gp-eventik/gp-eventik.php"
          if [ $? -ne 0 ]; then
            echo "❌ Error: estructura del ZIP incorrecta - falta gp-eventik/gp-eventik.php"
            exit 1
          fi

          TMP_DIR=$(mktemp -d)
          unzip -q dist/gp-eventik.zip -d $TMP_DIR
          ZIP_VERSION=$(grep "Version:" $TMP_DIR/gp-eventik/gp-eventik.php | head -1 | awk '{print $3}')
          ZIP_CONSTANT=$(grep "define('GPE_VERSION'" $TMP_DIR/gp-eventik/gp-eventik.php | awk -F"'" '{print $4}')
          rm -rf $TMP_DIR

          if [ "$ZIP_VERSION" != "${{ steps.increment_version.outputs.new_version }}" ]; then
            echo "❌ Error: versión distinta en la cabecera del ZIP (esperada ${{ steps.increment_version.outputs.new_version }}, obtenida $ZIP_VERSION)"
            exit 1
          fi

          if [ "$ZIP_CONSTANT" != "${{ steps.increment_version.outputs.new_version }}" ]; then
            echo "❌ Error: versión distinta en la constante GPS_VERSION (esperada ${{ steps.increment_version.outputs.new_version }}, obtenida $ZIP_CONSTANT)"
            exit 1
          fi

          echo "✅ Todas las validaciones del build pasaron"

      - name: Update gpe-plugin.json with new version
        run: |
          jq --arg version "${{ steps.increment_version.outputs.new_version }}" '.version = $version' gpe-plugin.json > gpe-plugin.json.tmp
          mv gpe-plugin.json.tmp gpe-plugin.json
          echo "Actualizado gpe-plugin.json a la versión ${{ steps.increment_version.outputs.new_version }}"

      - name: Commit version update
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add gpe-plugin.json
          git commit -m "chore: auto-increment version to ${{ steps.increment_version.outputs.new_version }}"
          git push origin main
          echo "✅ Versión commiteada a main"

      - name: Set SFTP port with default
        id: set_sftp_port
        run: |
          if [ -z "${{ secrets.SFTP_PORT }}" ]; then
            echo "sftp_port=22" >> $GITHUB_OUTPUT
          else
            echo "sftp_port=${{ secrets.SFTP_PORT }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to IONOS via lftp
        timeout-minutes: 4
        run: |
          echo "🔍 Desplegando por lftp..."
          sudo apt-get install -y lftp || (sudo apt-get update && sudo apt-get install -y lftp)

          lftp -u ${{ secrets.SFTP_USER }},${{ secrets.SFTP_PASSWORD }} -p ${{ steps.set_sftp_port.outputs.sftp_port }} sftp://${{ secrets.SFTP_HOST }} << LFTPEOF
          set sftp:auto-confirm yes
          set ssl:verify-certificate no
          set net:timeout 15
          set net:max-retries 2
          set net:reconnect-interval-base 5
          echo "== PWD inicial =="
          pwd
          echo "== LS raiz =="
          ls
          echo "== buscando updates =="
          find . -maxdepth 2 -name updates
          bye
          LFTPEOF

      - name: Validate deployment URLs
        run: |
          echo "🔍 Validando URLs de despliegue..."
          sleep 10

          JSON_URL="https://generacionpresente.org/wp-content/updates/gpe-plugin.json"
          JSON_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$JSON_URL")
          if [ "$JSON_STATUS" -ne 200 ]; then
            echo "❌ Error: gpe-plugin.json no accesible (HTTP $JSON_STATUS)"
            exit 1
          fi

          ZIP_URL="https://generacionpresente.org/wp-content/updates/gp-eventik.zip"
          ZIP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ZIP_URL")
          if [ "$ZIP_STATUS" -ne 200 ]; then
            echo "❌ Error: gp-eventik.zip no accesible (HTTP $ZIP_STATUS)"
            exit 1
          fi

          REMOTE_VERSION=$(curl -s "$JSON_URL" | jq -r '.version')
          if [ "$REMOTE_VERSION" != "${{ steps.increment_version.outputs.new_version }}" ]; then
            echo "❌ Error: versión remota distinta (esperada ${{ steps.increment_version.outputs.new_version }}, obtenida $REMOTE_VERSION)"
            exit 1
          fi

          REMOTE_NAME=$(curl -s "$JSON_URL" | jq -r '.name')
          REMOTE_SLUG=$(curl -s "$JSON_URL" | jq -r '.slug')
          REMOTE_DOWNLOAD_URL=$(curl -s "$JSON_URL" | jq -r '.download_url')

          if [ "$REMOTE_NAME" != "GP Eventik" ]; then
            echo "❌ Error: name remoto incorrecto (esperado 'GP Eventik', obtenido '$REMOTE_NAME')"
            exit 1
          fi

          if [ "$REMOTE_SLUG" != "gp-eventik" ]; then
            echo "❌ Error: slug remoto incorrecto (esperado 'gp-eventik', obtenido '$REMOTE_SLUG')"
            exit 1
          fi

          if [[ ! "$REMOTE_DOWNLOAD_URL" == *"gp-eventik.zip"* ]]; then
            echo "❌ Error: download_url remoto incorrecto (esperado contener 'gp-eventik.zip', obtenido '$REMOTE_DOWNLOAD_URL')"
            exit 1
          fi

          echo "✅ Todas las validaciones de despliegue pasaron"
          echo "📊 JSON: $JSON_URL"
          echo "📦 ZIP:  $ZIP_URL"

      - name: Clean up
        run: rm -rf dist
